# 플래너 서비스 로컬 타입 체커 / 린터 설정
# (IDE의 Mypy·basedpyright가 이 파일을 읽도록 backend/planer.kroaddy.site 를 워크스페이스 루트로 두거나
#  상위에서 extends 하면 됩니다.)

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "langchain_google_genai",
    "langchain_google_genai.*",
    "boto3",
    "botocore",
    "botocore.*",
]
ignore_missing_imports = true

[tool.pyright]
include = ["app"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
# 서드파티에 py.typed/스텁이 없을 때 IDE 경고 완화 (앱 코드 import는 그대로 검사)
reportMissingImports = false
reportMissingModuleSource = false

[tool.basedpyright]
include = ["app"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingModuleSource = false
