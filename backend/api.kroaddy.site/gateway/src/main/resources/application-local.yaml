# 로컬 개발용 프로파일
# 실행 시 --spring.profiles.active=local 옵션 사용
# 또는 SPRING_PROFILES_ACTIVE=local 환경 변수 설정
#
# Refresh Token 해시(TokenHashUtil): System.getenv("REFRESH_TOKEN_HASH_SECRET") 만 사용합니다.
# - Docker: backend/api.kroaddy.site/.env 에 REFRESH_TOKEN_HASH_SECRET=... (루트 docker-compose의 gateway env_file)
# - IDE에서 직접 실행 시: Run Configuration 환경 변수에 동일 키를 넣거나, 터미널에서 export 후 실행

spring:
  servlet:
    multipart:
      # Tourstar 이미지 업로드 프록시 용량 상향 (로컬 개발용)
      max-file-size: 20MB
      max-request-size: 50MB
  datasource:

    # 로컬 개발 시 데이터베이스 연결이 없어도 실행 가능하도록 설정
    # 실제 사용 시에는 환경 변수로 설정하세요
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/test}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    # 데이터소스가 없어도 실행 가능하도록 (선택사항)
    # continue-on-error: true
  
  data:
    redis:
      # Upstash: rediss:// URL 사용 시 host/port/password 대신 URL만 사용
      url: ${UPSTASH_REDIS_URL:}
      host: ${UPSTASH_REDIS_HOST:localhost}
      port: ${UPSTASH_REDIS_PORT:6379}
      password: ${UPSTASH_REDIS_PASSWORD:}
      ssl:
        enabled: true

# AI 서비스 URL (로컬 개발 시)
# 게이트웨이 라우트(Path)는 application.yaml 상속 — Guide: /api/v1/guide/**, /api/v1/place/** 등
# Guide만 로컬 8002로 띄울 때: AI_SERVICE_GUIDE_URL=http://localhost:8002
ai:
  service:
    rag:
      url: ${AI_SERVICE_RAG_URL:http://localhost:8001}
    vision:
      url: ${AI_SERVICE_VISION_URL:}
    # Docker 환경: host.docker.internal / 로컬 직접 실행: localhost
    guide:
      url: ${AI_SERVICE_GUIDE_URL:${AI_SERVICE_FESTIVAL_URL:http://guide:8002}}
    # backward-compat alias
    festival:
      url: ${AI_SERVICE_GUIDE_URL:${AI_SERVICE_FESTIVAL_URL:http://guide:8002}}
    tourplaner:
      url: ${AI_SERVICE_TOURPLANER_URL:http://localhost:8003}
    user-info:
      url: ${AI_SERVICE_USER_INFO_URL:http://localhost:8004}
    tourstar:
      url: ${AI_SERVICE_TOURSTAR_URL:http://localhost:8010}

