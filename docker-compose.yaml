# Kroaddy MSA - 통합 Docker Compose
# 포트 구성:
#   gateway → 8080 (Spring Boot / 인증·프록시)
#   guide    → 8002 (FastAPI / 장소/행사 추천 데이터)
#   planer   → 8003 (FastAPI / AI 여행 루트·일정·날씨)
#   profile  → 8004 (FastAPI / 개인화 프로필)
#
# 사용법:
#   docker compose up -d --build
#   docker compose up -d --build gateway   (게이트웨이만 재빌드)

services:

  # ── Spring Boot Gateway (인증 + 프록시) ───────────────────────────────────
  gateway:
    build:
      context: ./backend/api.kroaddy.site
      dockerfile: gateway/Dockerfile
    image: kroaddy-gateway:latest
    container_name: kroaddy-gateway
    env_file:
      - ./backend/api.kroaddy.site/.env
    environment:
      SPRING_PROFILES_ACTIVE: local
      AI_SERVICE_GUIDE_URL: http://guide:8002
      AI_SERVICE_TOURPLANER_URL: http://planer:8003
      AI_SERVICE_USER_INFO_URL: http://profile:8004
      AI_SERVICE_TOURSTAR_URL: http://tourstar:8010
      AI_SERVICE_NEWS_URL: http://news:8005
    ports:
      - "8080:8080"
    depends_on:
      - guide
      - planer
      - profile
      - tourstar
      - news
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kroaddy-net

  # ── Guide API (장소/행사 추천 데이터, 포트 8002) ──────────────────────────
  guide:
    build:
      context: ./backend/guide.kroaddy.site
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-kroaddy}/kroaddy-guide:latest
    container_name: kroaddy-guide
    env_file:
      - ./backend/guide.kroaddy.site/.env
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - kroaddy-net

  # ── Tour Planner API (AI 여행 루트·일정, 포트 8003) ──────────────────────
  planer:
    build:
      context: ./backend/planer.kroaddy.site
      dockerfile: Dockerfile
    image: kroaddy-planer:latest
    container_name: kroaddy-planer
    env_file:
      - ./backend/planer.kroaddy.site/.env
    environment:
      GUIDE_SERVICE_URL: http://guide:8002
      USER_INFO_SERVICE_URL: http://profile:8004
      # .env 파일에 없을 경우 대비해 명시 (EC2에서 환경변수로 주입 가능)
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    ports:
      - "8003:8003"
    depends_on:
      - guide
      - profile
    restart: unless-stopped
    networks:
      - kroaddy-net

  # ── Profile Service (개인화 프로필, 포트 8004) ────────────────────────────
  profile:
    build:
      context: ./backend/profile.kroaddy.site
      dockerfile: Dockerfile
    image: kroaddy-profile:latest
    container_name: kroaddy-profile
    env_file:
      - ./backend/profile.kroaddy.site/.env
    ports:
      - "8004:8004"
    restart: unless-stopped
    networks:
      - kroaddy-net

  # ── News API (뉴스 RSS 크롤링 + GPT 분류, 포트 8005) ────────────────────
  news:
    build:
      context: ./backend/news.kroaddy.site
      dockerfile: Dockerfile
    image: necromancer1234/news.kroaddy.site:latest
    container_name: kroaddy-news
    env_file:
      - ./backend/news.kroaddy.site/.env
    ports:
      - "8005:8005"
    restart: unless-stopped
    networks:
      - kroaddy-net

  # ── Tourstar Service (사진 선별/게시글 생성, 포트 8010) ───────────────────
  tourstar:
    build:
      context: ./backend/tourstar.kroaddy.site
      dockerfile: Dockerfile
    image: kroaddy-tourstar:latest
    container_name: kroaddy-tourstar
    env_file:
      - ./backend/tourstar.kroaddy.site/.env
    volumes:
      - ./backend/tourstar.kroaddy.site/artifacts/models:/app/artifacts/models:ro
    ports:
      - "8010:8010"
    restart: unless-stopped
    networks:
      - kroaddy-net

networks:
  kroaddy-net:
    driver: bridge
